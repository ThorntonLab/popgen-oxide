[package]
name = "python-integration-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "integration_tests"
crate-type = ["cdylib"]

[dependencies]
popgen = { version = "0.10.0-alpha.0", path = "../popgen" }
popgen-tskit = { version = "0.10.0-alpha.0", path = "../popgen-tskit" }
pyo3 = "0.29.0"
tskit = { workspace = true }
tskit2tskit = { version = "0.1.0-alpha.0", git = "https://github.com/molpopgen/tskit2tskit", branch = "main" }
