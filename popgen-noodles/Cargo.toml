[package]
name = "popgen-noodles"
version = "0.10.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "noodles helper utilities for the popgen ecosystem."
homepage = "https://github.com/ThorntonLab/popgen-oxide"
repository = "https://github.com/ThorntonLab/popgen-oxide"

[lints]
workspace = true

[dependencies]
popgen = { version = "0.10.0-alpha.0", path = "../popgen" }
noodles = { version = "0.109.0", features = ["vcf", "csi", "tabix", "bgzf", "core"] }

[dev-dependencies]
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }

[[example]]
name = "concurrent"

[[example]]
name = "from_vcf_noodles"

[[example]]
name = "from_vcf_noodles_indexed"
